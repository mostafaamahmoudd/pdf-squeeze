name: release-builds

on:
  workflow_dispatch:
  push:
    branches: ['ci/**', 'feat/**', 'chore/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows-build.yml

  unix:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies and Ghostscript
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev ghostscript zenity desktop-file-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Verify native Rust target and Ghostscript
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
          gs --version

      - name: Fetch all locked sources for license verification
        run: cargo fetch --locked

      - name: Verify third-party licensing material
        run: |
          python3 scripts/license_inventory.py --check
          python3 scripts/verify_licenses.py --require-publishable --platform '${{ matrix.platform }}'

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Ghostscript integration and GUI worker tests
        run: cargo test --locked -- --ignored

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Test release packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Package release
        run: python3 scripts/package_release.py --platform '${{ matrix.platform }}' --binary target/release/pdf-squeeze --out-dir release-dist

      - name: Verify archived licensing material
        run: python3 scripts/verify_licenses.py --require-publishable --platform '${{ matrix.platform }}' --archive 'release-dist/pdf-squeeze-${{ matrix.platform }}.tar.gz'

      - name: Verify Linux archive, dynamic libraries and CLI
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-squeeze-release-check"
          tar -xzf release-dist/pdf-squeeze-linux-x64.tar.gz -C "$RUNNER_TEMP/pdf-squeeze-release-check"
          executable="$RUNNER_TEMP/pdf-squeeze-release-check/pdf-squeeze"
          test -x "$executable"
          test -f "$RUNNER_TEMP/pdf-squeeze-release-check/README.md"
          test -f "$RUNNER_TEMP/pdf-squeeze-release-check/INSTALL.md"
          desktop="$RUNNER_TEMP/pdf-squeeze-release-check/share/applications/pdf-squeeze.desktop"
          desktop-file-validate "$desktop"
          for size in 16 32 48 64 128 256 512; do
            test -s "$RUNNER_TEMP/pdf-squeeze-release-check/share/icons/hicolor/${size}x${size}/apps/pdf-squeeze.png"
          done
          file "$executable"
          ldd "$executable" | tee "$RUNNER_TEMP/pdf-squeeze-ldd.txt"
          if grep -Eq 'not found|libgs\.' "$RUNNER_TEMP/pdf-squeeze-ldd.txt"; then exit 1; fi
          "$executable" tests/fixtures/tiny.pdf --output "$RUNNER_TEMP/pdf-squeeze-release-output.pdf"
          cmp tests/fixtures/tiny.pdf "$RUNNER_TEMP/pdf-squeeze-release-output.pdf"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-dist/pdf-squeeze-${{ matrix.platform }}.*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, unix]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust for package version check
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Fetch locked sources for platform publication verification
        run: cargo fetch --locked

      - name: Validate release tag
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pdf-squeeze"))')
          test "$GITHUB_REF_NAME" = "v$version"
          if test ! -s LICENSE; then
            echo 'A verified LICENSE file is required before publishing a Release' >&2
            exit 1
          fi
          python3 scripts/verify_licenses.py --require-publishable --platform windows-x64
          python3 scripts/verify_licenses.py --require-publishable --platform linux-x64
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-dist
          merge-multiple: true

      - name: Verify publication license documentation in every archive
        run: |
          python3 scripts/verify_licenses.py --require-publishable --platform windows-x64 \
            --archive release-dist/pdf-squeeze-windows-x64.zip
          python3 scripts/verify_licenses.py --require-publishable --platform linux-x64 \
            --archive release-dist/pdf-squeeze-linux-x64.tar.gz

      - name: Verify archives and generate checksums
        run: |
          cd release-dist
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          for archive in pdf-squeeze-windows-x64.zip pdf-squeeze-linux-x64.tar.gz; do
            test -s "$archive"
          done
          sha256sum pdf-squeeze-windows-x64.zip pdf-squeeze-linux-x64.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > generated-notes.md
          cat packaging/RELEASE_NOTES.md generated-notes.md > release-notes.md

      - name: Publish release after all packages pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-dist/pdf-squeeze-windows-x64.zip \
            release-dist/pdf-squeeze-linux-x64.tar.gz \
            release-dist/SHA256SUMS.txt \
            --draft --verify-tag --title "PDF Squeeze $GITHUB_REF_NAME" --notes-file release-notes.md
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 3
          gh release edit "$GITHUB_REF_NAME" --draft=false
