name: release-builds

on:
  workflow_dispatch:
  push:
    branches: ['ci/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows-build.yml

  unix:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            macho_arch: arm64
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            macho_arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies and Ghostscript
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev ghostscript zenity

      - name: Install macOS Ghostscript
        if: runner.os == 'macOS'
        run: brew install ghostscript

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Verify native Rust target and Ghostscript
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
          gs --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Ghostscript integration and GUI worker tests
        run: cargo test --locked -- --ignored

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Test release packaging
        run: python3 -m unittest discover -s tests -p test_release_package.py

      - name: Package release
        run: python3 scripts/package_release.py --platform '${{ matrix.platform }}' --binary target/release/pdf-squeeze --out-dir release-dist

      - name: Verify Linux archive, dynamic libraries and CLI
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-squeeze-release-check"
          tar -xzf release-dist/pdf-squeeze-linux-x64.tar.gz -C "$RUNNER_TEMP/pdf-squeeze-release-check"
          executable="$RUNNER_TEMP/pdf-squeeze-release-check/pdf-squeeze"
          test -x "$executable"
          test -f "$RUNNER_TEMP/pdf-squeeze-release-check/README.md"
          test -f "$RUNNER_TEMP/pdf-squeeze-release-check/INSTALL.md"
          file "$executable"
          ldd "$executable" | tee "$RUNNER_TEMP/pdf-squeeze-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/pdf-squeeze-ldd.txt"; then exit 1; fi
          "$executable" tests/fixtures/tiny.pdf --output "$RUNNER_TEMP/pdf-squeeze-release-output.pdf"
          cmp tests/fixtures/tiny.pdf "$RUNNER_TEMP/pdf-squeeze-release-output.pdf"

      - name: Verify macOS app bundle and CLI
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-squeeze-release-check"
          unzip -q 'release-dist/pdf-squeeze-${{ matrix.platform }}.zip' -d "$RUNNER_TEMP/pdf-squeeze-release-check"
          app="$RUNNER_TEMP/pdf-squeeze-release-check/PDF Squeeze.app"
          executable="$app/Contents/MacOS/pdf-squeeze"
          test -x "$executable"
          test -f "$RUNNER_TEMP/pdf-squeeze-release-check/README.md"
          test -f "$RUNNER_TEMP/pdf-squeeze-release-check/INSTALL.md"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")" = 'pdf-squeeze'
          test "$(lipo -archs "$executable")" = '${{ matrix.macho_arch }}'
          otool -L "$executable"
          "$executable" tests/fixtures/tiny.pdf --output "$RUNNER_TEMP/pdf-squeeze-release-output.pdf"
          cmp tests/fixtures/tiny.pdf "$RUNNER_TEMP/pdf-squeeze-release-output.pdf"
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin "$executable" tests/fixtures/tiny.pdf --output "$RUNNER_TEMP/pdf-squeeze-finder-path-output.pdf"
          cmp tests/fixtures/tiny.pdf "$RUNNER_TEMP/pdf-squeeze-finder-path-output.pdf"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-dist/pdf-squeeze-${{ matrix.platform }}.*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, unix]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust for package version check
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Validate release tag
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pdf-squeeze"))')
          test "$GITHUB_REF_NAME" = "v$version"
          if test ! -s LICENSE; then
            echo 'A verified LICENSE file is required before publishing a Release' >&2
            exit 1
          fi
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-dist
          merge-multiple: true

      - name: Verify archives and generate checksums
        run: |
          cd release-dist
          for archive in pdf-squeeze-windows-x64.zip pdf-squeeze-linux-x64.tar.gz pdf-squeeze-macos-arm64.zip pdf-squeeze-macos-x64.zip; do
            test -s "$archive"
          done
          sha256sum pdf-squeeze-windows-x64.zip pdf-squeeze-linux-x64.tar.gz pdf-squeeze-macos-arm64.zip pdf-squeeze-macos-x64.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > generated-notes.md
          cat packaging/RELEASE_NOTES.md generated-notes.md > release-notes.md

      - name: Publish release after all packages pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-dist/pdf-squeeze-windows-x64.zip \
            release-dist/pdf-squeeze-linux-x64.tar.gz \
            release-dist/pdf-squeeze-macos-arm64.zip \
            release-dist/pdf-squeeze-macos-x64.zip \
            release-dist/SHA256SUMS.txt \
            --draft --verify-tag --title "PDF Squeeze $GITHUB_REF_NAME" --notes-file release-notes.md
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 5
          gh release edit "$GITHUB_REF_NAME" --draft=false
