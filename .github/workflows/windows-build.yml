name: windows-build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify PDF fixture checkout
        shell: pwsh
        run: |
          @'
          import hashlib
          import pathlib
          import subprocess

          fixture = pathlib.Path('tests/fixtures/tiny.pdf')
          checkout = fixture.read_bytes()
          blob = subprocess.check_output(['git', 'show', 'HEAD:tests/fixtures/tiny.pdf'])
          digest = lambda data: hashlib.sha256(data).hexdigest()
          if checkout != blob:
              raise SystemExit(
                  f'{fixture} differs from Git blob: checkout {len(checkout)} bytes, '
                  f'SHA-256 {digest(checkout)}; blob {len(blob)} bytes, '
                  f'SHA-256 {digest(blob)}')
          print(f'{fixture}: {len(checkout)} bytes, SHA-256 {digest(checkout)}; matches Git blob')
          '@ | python -

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests including Windows console suppression
        run: cargo test --locked

      - name: Install Ghostscript
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Extract the upstream installer; interactive installation stalls on headless runners.
          $installer = Join-Path $env:RUNNER_TEMP 'gs10080w64.exe'
          $root = Join-Path $env:RUNNER_TEMP 'ghostscript'
          Invoke-WebRequest 'https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/gs10080w64.exe' -OutFile $installer
          $expectedHash = '52a91b8bf09298788d7a57b9206127026c23eacd75405f0a131e26dc381dce50'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Ghostscript archive checksum mismatch'
          }
          & "$env:ProgramFiles\7-Zip\7z.exe" x $installer "-o$root" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "GS_LIB=$root\lib;$root\Resource\Init;$root\Resource\Font;$root\fonts" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$root\bin\gswin64c.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Ghostscript integration and GUI worker tests
        run: cargo test --locked -- --ignored

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Test release packaging
        run: python -m unittest discover -s tests -p test_release_package.py

      - name: Package Windows release
        run: python scripts/package_release.py --platform windows-x64 --binary target/release/pdf-squeeze.exe --out-dir release-dist

      - name: Verify Windows archive and release executable
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP 'pdf-squeeze-release-check'
          Expand-Archive release-dist/pdf-squeeze-windows-x64.zip -DestinationPath $extracted
          $exe = Join-Path $extracted 'pdf-squeeze.exe'
          $output = Join-Path $env:RUNNER_TEMP 'pdf-squeeze-release-output.pdf'
          if (!(Test-Path $exe) -or !(Test-Path (Join-Path $extracted 'INSTALL.md')) -or
              !(Test-Path (Join-Path $extracted 'README.md')) -or
              !(Test-Path (Join-Path $extracted 'pdf-squeeze.ico'))) {
            throw 'Windows archive is incomplete'
          }
          @'
          from pathlib import Path
          import struct

          icon = Path('release-dist/pdf-squeeze-windows-x64.zip')
          import zipfile
          with zipfile.ZipFile(icon) as package:
              data = package.read('pdf-squeeze.ico')
          reserved, kind, count = struct.unpack_from('<HHH', data)
          assert (reserved, kind, count) == (0, 1, 7)
          sizes = set()
          for index in range(count):
              width, height, _, _, _, depth, length, offset = struct.unpack_from(
                  '<BBBBHHII', data, 6 + index * 16)
              width, height = width or 256, height or 256
              assert depth == 32 and data[offset:offset + 8] == b'\x89PNG\r\n\x1a\n'
              assert offset + length <= len(data)
              sizes.add((width, height))
          assert sizes == {(s, s) for s in (16, 24, 32, 48, 64, 128, 256)}

          exe = Path('target/release/pdf-squeeze.exe').read_bytes()
          pe_offset = struct.unpack_from('<I', exe, 0x3c)[0]
          assert exe[pe_offset:pe_offset + 4] == b'PE\0\0'
          subsystem = struct.unpack_from('<H', exe, pe_offset + 24 + 68)[0]
          assert subsystem == 2, f'Expected Windows GUI subsystem, got {subsystem}'
          print('Multi-resolution icon and Windows GUI subsystem verified')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = @'
          using System;
          using System.Runtime.InteropServices;
          public static class PdfSqueezeIconProbe {
              [DllImport("kernel32.dll", EntryPoint = "LoadLibraryExW", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibraryEx(string path, IntPtr file, uint flags);
              [DllImport("kernel32.dll", EntryPoint = "FindResourceW", SetLastError = true)]
              public static extern IntPtr FindResource(IntPtr module, IntPtr name, IntPtr type);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          Add-Type -TypeDefinition $probe
          $module = [PdfSqueezeIconProbe]::LoadLibraryEx($exe, [IntPtr]::Zero, 2)
          if ($module -eq [IntPtr]::Zero) { throw 'Could not inspect Windows executable resources' }
          try {
            if ([PdfSqueezeIconProbe]::FindResource($module, [IntPtr]1, [IntPtr]14) -eq [IntPtr]::Zero) {
              throw 'Windows executable has no application icon resource (group icon 1)'
            }
          } finally {
            [void][PdfSqueezeIconProbe]::FreeLibrary($module)
          }
          $arguments = 'tests/fixtures/tiny.pdf --output "' + $output + '"'
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Release executable exited with $($process.ExitCode)" }
          if ((Get-FileHash $output -Algorithm SHA256).Hash -ne
              (Get-FileHash tests/fixtures/tiny.pdf -Algorithm SHA256).Hash) {
            throw 'Release executable produced unexpected PDF output'
          }
          Write-Host 'Windows archive and release CLI smoke test passed'

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-squeeze-windows
          path: target/release/pdf-squeeze.exe
          if-no-files-found: error

      - name: Upload Windows release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-dist/pdf-squeeze-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
