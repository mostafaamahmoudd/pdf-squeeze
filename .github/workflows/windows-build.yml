name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests including Windows console suppression
        run: cargo test --locked

      - name: Install Ghostscript
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Extract the upstream installer; interactive installation stalls on headless runners.
          $installer = Join-Path $env:RUNNER_TEMP 'gs10080w64.exe'
          $root = Join-Path $env:RUNNER_TEMP 'ghostscript'
          Invoke-WebRequest 'https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/gs10080w64.exe' -OutFile $installer
          $expectedHash = '52a91b8bf09298788d7a57b9206127026c23eacd75405f0a131e26dc381dce50'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Ghostscript archive checksum mismatch'
          }
          & "$env:ProgramFiles\7-Zip\7z.exe" x $installer "-o$root" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "GS_LIB=$root\lib;$root\Resource\Init;$root\Resource\Font;$root\fonts" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$root\bin\gswin64c.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnose PDF fixture bytes and Ghostscript
        shell: pwsh
        run: |
          @'
          import hashlib
          import pathlib
          import subprocess
          import tempfile

          fixture = pathlib.Path('tests/fixtures/tiny.pdf')
          checkout = fixture.read_bytes()
          blob = subprocess.check_output(['git', 'show', 'HEAD:tests/fixtures/tiny.pdf'])
          for label, data in [('checkout', checkout), ('Git blob', blob)]:
              print(f'{label}: {len(data)} bytes, SHA-256 {hashlib.sha256(data).hexdigest()}')
          print('Git attributes:', subprocess.check_output(
              ['git', 'check-attr', '-a', '--', str(fixture)], text=True).strip() or '(none)')
          for setting in ['core.autocrlf', 'core.eol', 'core.safecrlf']:
              result = subprocess.run(['git', 'config', '--show-origin', '--get', setting],
                                      capture_output=True, text=True)
              print(f'{setting}: {result.stdout.strip() or "(unset)"}')

          with tempfile.TemporaryDirectory() as directory:
              original = pathlib.Path(directory) / 'original.pdf'
              original.write_bytes(blob)
              for label, path in [('checkout', fixture), ('Git blob', original)]:
                  result = subprocess.run(['gswin64c', '-q', '-dBATCH', '-dNOPAUSE',
                                           '-dPDFSTOPONERROR', '-sDEVICE=nullpage', str(path)],
                                          capture_output=True, text=True)
                  print(f'Ghostscript {label}: exit {result.returncode}')
                  if result.returncode:
                      print((result.stdout + result.stderr)[-1500:])
          '@ | python -

      - name: Run Ghostscript integration and GUI worker tests
        run: cargo test --locked -- --ignored

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-squeeze-windows
          path: target/release/pdf-squeeze.exe
          if-no-files-found: error
