name: pull-request-checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Linux checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Install Linux build and test dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libdbus-1-dev \
            ghostscript zenity desktop-file-utils

      - name: Run documentation, licensing and packaging regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Fetch all locked sources for license verification
        run: cargo fetch --locked

      - name: Verify third-party licensing material
        run: |
          python3 scripts/license_inventory.py --check
          python3 scripts/verify_licenses.py

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Ghostscript integration and GUI worker tests
        run: cargo test --locked -- --ignored

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
